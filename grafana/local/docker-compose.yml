# Grafana local para explorar a gold sem AWS. Uso: ver grafana/README.md, secao 6.
services:
  grafana:
    image: grafana/grafana:latest-ubuntu     # a imagem Alpine padrao nao roda o plugin DuckDB
    container_name: grafana-grupo4
    ports:
      - "3000:3000"
    environment:
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: motherduck-duckdb-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/dashboard_voos_x_trends_local.json
    volumes:
      - ./plugins:/var/lib/grafana/plugins
      - ./provisioning:/etc/grafana/provisioning
      - ../../data/gold:/gold:ro
